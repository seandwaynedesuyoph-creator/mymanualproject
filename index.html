<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flight Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 18px;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <h1>✈️ FlightEye Tracker Hub</h1>
    <p>Click the button below to launch the live tracking map instantly:</p>
    
    <br>
    
    <a href="https://flighteye.org/flighteye/map" target="_blank" class="btn">
        Open Live FlightEye Map 🚀
    </a>

</body>
</html>
